# PREEMPT-RT for the AZ01 boards (linux-yocto-rt only; added by
# linux-yocto-rt_%.bbappend).
#
# The az01 defconfig was produced with `savedefconfig` on the non-RT tree,
# where ARCH_SUPPORTS_RT is n and PREEMPT_RT therefore cannot be recorded -
# so the defconfig alone builds linux-yocto-rt as PREEMPT_NONE. The vendor
# kernel this replaces is an -rt build. Select the preemption model
# explicitly; EXPERT (a dependency) is already set by the defconfig.
#
# Deliberately not ktypes/preempt-rt/preempt-rt.scc: that ktype layers the
# yocto developer config (MD RAID, netfilter, NLS, ...) on top, which the
# trimmed az01 defconfig exists to avoid.
CONFIG_PREEMPT_RT=y
# CONFIG_PREEMPT_NONE is not set
