# Baseline deltas on top of multi_v7_defconfig for the AZ01 boards.

# multi_v7_defconfig does NOT set these, and systemd will not come up without
# a devtmpfs mounted on /dev.
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y

# The console is NOT specified on the kernel command line - the vendor u-boot's
# bootargs carry no console= at all (confirmed by reading the env off a JP11).
# It comes entirely from the device tree's chosen/stdout-path = "serial2:...".
# So if these regress, the board goes completely silent with no error. Pin them.
CONFIG_SERIAL_8250=y
CONFIG_SERIAL_8250_CONSOLE=y
CONFIG_SERIAL_8250_DW=y
CONFIG_SERIAL_OF_PLATFORM=y
CONFIG_SERIAL_EARLYCON=y

# Keep /lib/modules/<version> stable across rebuilds so the modules path does
# not move under the rootfs on every commit.
# CONFIG_LOCALVERSION_AUTO is not set

# --- Boot-critical: the eMMC cannot probe without its regulators -------------
# The jp11 eMMC node (dwmmc@ff0f0000) has vmmc-supply and vqmmc-supply pointing
# at regulators on the ACT8846 PMIC (compatible "active-semi,act8846", handled
# by the act8865 driver). multi_v7_defconfig does not enable it, so those
# supplies never register, dw_mmc defers forever, no root device appears and
# the kernel sits in rootwait with no error beyond a lone
# "deferred probe pending". Observed exactly that on the first D1 boot.
# REGULATOR_ACT8865 is "depends on I2C && POWER_SUPPLY". POWER_SUPPLY is not in
# multi_v7_defconfig, so without this line the act8865 line is SILENTLY DROPPED
# by the alldefconfig merge - no error, it just never appears in .config.
# (POWER_SUPPLY is wanted anyway: inmusic,az01-power is a power_supply driver.)
CONFIG_POWER_SUPPLY=y
CONFIG_REGULATOR_ACT8865=y

# --- Built-in, not modular --------------------------------------------------
# These are =m in multi_v7_defconfig, and this image ships no modules at all,
# so modular means absent. Both are wanted: the RTC for wall-clock time, and
# the SARADC because inmusic,az01-power reads io-channels = <&saradc 0>.
CONFIG_RTC_DRV_HYM8563=y
CONFIG_ROCKCHIP_SARADC=y

# --- Phase E: hardware confirmed present on a real JP11 -----------------------
# See docs/az01-hardware-facts.md. All of these were measured on the device
# running the vendor kernel, not inferred.

# Touchscreen. The fitted part is an ILI2117 (not the ILI2116 the shipped DTB
# enables - u-boot swaps them). Mainline ili210x.c already matches
# "ilitek,ili2117", so no vendor driver is needed here at all.
CONFIG_INPUT_TOUCHSCREEN=y
CONFIG_TOUCHSCREEN_ILI210X=y

# Battery. It is a plain SBS pack (JMS ACVB-BF) on i2c3 at 0x0b, which mainline
# handles. Without this the node sits in "deferred probe pending" forever.
CONFIG_I2C_CHARDEV=y
CONFIG_POWER_SUPPLY=y
CONFIG_BATTERY_SBS=y

# Display pipeline. These default to =m, and the az01-ksrc path installs no
# modules, so rockchip-drm was never loaded and X had no DRM device at all.
# Build them in instead of reintroducing a module tree.
CONFIG_DRM=y
CONFIG_DRM_ROCKCHIP=y
CONFIG_ROCKCHIP_DW_MIPI_DSI=y
CONFIG_DRM_PANEL_SIMPLE=y
CONFIG_BACKLIGHT_CLASS_DEVICE=y
CONFIG_DRM_FBDEV_EMULATION=y

# DC-jack sense, added by 0002-power-supply-*.patch. Built in, not modular:
# the az01-ksrc path installs no modules at all.
CONFIG_IIO=y
CONFIG_ROCKCHIP_SARADC=y
CONFIG_AZ01_POWER=y

# Reboot into the bootloader from Linux. The DT has a syscon-reboot-mode node
# (mode-loader = 0x5242c301) that u-boot reads to decide whether to enter
# fastboot. Without this driver "reboot loader" is just a reboot, and the only
# way to reflash is physical intervention on the device.
CONFIG_POWER_RESET=y
CONFIG_SYSCON_REBOOT_MODE=y

# Note on performing the restart: nothing is needed here. The board's
# /gpio-restart node (gpio0 pin 9, priority 255) is driven by
# POWER_RESET_GPIO_RESTART, which multi_v7_defconfig already sets, and
# rockchip_restart_handler in drivers/clk/rockchip/clk.c registers a CRU
# global-soft-reset fallback at priority 128 regardless.
#
# This block used to pin POWER_RESET_GPIO_RESTART=y and force POWER_RESET_GPIO
# off. Both were residue from chasing the reboot hang down the wrong path - the
# first was redundant with the defconfig, and the second disabled a gpio-poweroff
# driver that has nothing to bind to (zero gpio-poweroff nodes across all 53
# boards). The hang was the RK3288 OHCI; see the USB section below.

# The SC6000's HX8260 DSI panel, added by 0003-drm-panel-*.patch.
CONFIG_DRM_MIPI_DSI=y
CONFIG_DRM_PANEL=y
CONFIG_DRM_PANEL_HIMAX_HX8260=y

# The ILI9881C-based panels, the Prime GO's among them, are driven by the
# in-tree ILI9881C driver, which 0009-drm-panel-ilitek-ili9881c-*.patch
# teaches about them.
CONFIG_DRM_PANEL_ILITEK_ILI9881C=y

# The JD9365-based panels, driven by the in-tree JD9365 driver, which
# 0010-drm-panel-jadard-jd9365da-h3-*.patch teaches about them.
CONFIG_DRM_PANEL_JADARD_JD9365DA_H3=y

# --- Anything this board needs must be =y, never =m ---------------------------
# The az01-ksrc path installs NO modules (AZ0X_ESSENTIAL_MODULES is empty there),
# so a driver left at =m is simply dead. multi_v7_defconfig leaves 637 symbols
# at =m, and the ones our device tree actually references have to be forced in.
#
# This has now bitten twice: DRM_ROCKCHIP=m meant rockchip-drm never loaded and
# X had no DRM device, and PWM_ROCKCHIP=m meant the PWM controller never probed,
# so pwm-backlight deferred forever and took the DSI panel down with it -
# "mipi-dsi ff960000.mipi.0: deferred probe pending" with no hint as to why.
CONFIG_PWM_ROCKCHIP=y

# GPU. X wants GL, and the vendor kernel binds panfrost on this SoC.
CONFIG_DRM_PANFROST=y

# With the VOP IOMMU disabled (see rk3288-az01-jp11-fitted.dtsi) rockchip-drm
# allocates the framebuffer from CMA instead of scatter-gather, so there has to
# be enough contiguous memory: 800x1280x4 is 4 MiB per buffer, and fbdev plus
# a page flip wants a few of them.
CONFIG_CMA=y
CONFIG_DMA_CMA=y
CONFIG_CMA_SIZE_MBYTES=32

# --- Wi-Fi -------------------------------------------------------------------
# Broadcom BCM43456 on SDIO (dwmmc@ff0d0000, node brcm,bcm4329-fmac). The
# firmware is already staged by az0x-firmware as brcm/brcmfmac43456-sdio.{bin,txt}.
#
# Built in, not modular, for the usual reason: this path installs no modules.
CONFIG_CFG80211=m
CONFIG_BRCMUTIL=m
CONFIG_BRCMFMAC=m
CONFIG_BRCMFMAC_SDIO=y

# The power sequence that drives WIFI_REG_ON and the 32k clock (/sdio-pwrseq,
# mmc-pwrseq-simple) needs PWRSEQ_SIMPLE. Note the symbol is PWRSEQ_SIMPLE, not
# MMC_PWRSEQ_SIMPLE as the binding name suggests, and it is already default y -
# listing it here is belt and braces so a defconfig change cannot quietly drop
# it and leave the SDIO bus empty with no obvious cause.
CONFIG_PWRSEQ_SIMPLE=y

# No firmware is embedded in the kernel image, and none needs to be.
#
# brcmfmac, cfg80211 and the Bluetooth transport are all modules, so they are
# loaded after the rootfs is mounted and find their firmware in /lib/firmware
# the ordinary way. The vendor does exactly this - its CONFIG_EXTRA_FIRMWARE is
# empty too.
#
# This was not always true. While those drivers were built in, their firmware
# requests happened during kernel init, before the rootfs existed, and three
# things failed that way: brcmfmac raced the eMMC probe and came up with no
# wlan0, the BT patchram could not be found, and cfg80211 asked for
# regulatory.db 29ms before EXT4 mounted. Embedding was the fix then. Modules
# are the fix now, and they are also what the vendor ships.

# The USB host port: EHCI yes, OHCI no.
#
# usb@ff500000 (generic-ehci) and usb@ff520000 (generic-ohci) are siblings that
# share one clock (cru 0x1c2) and one PHY (usb-phy@334). The vendor device tree
# marks both "okay" and we reproduce it faithfully, but mainline says of the
# OHCI, in arch/arm/boot/dts/rockchip/rk3288.dtsi:
#
#   /* NOTE: doesn't work on RK3288, but was fixed on RK3288W */
#   usb_host0_ohci: usb@ff520000 { ... status = "disabled"; };
#
# introduced by commit 82540defdd9cf ("ARM: dts: rockchip: Add usb host0 ohci
# node for rk3288", Jagan Teki, 2020, merged by the Rockchip maintainer with a
# Rockchip engineer on Cc): "Although rk3288 ohci doesn't actually work on
# hardware, but rk3288w ohci can work well."
#
# Upstream says only that it does not work; it does not describe a failure mode.
# What follows is our own measurement on a Prime GO, not an upstream claim.
#
# The controller probes, registers a root hub, and then - with nothing plugged
# into the port - runtime-suspends. From that moment every access to 0xff520000
# stalls the bus and wedges the whole SoC. Confirmed three ways, each of which
# hung the board outright:
#
#   cat /sys/kernel/debug/usb/ohci/ff520000.usb/registers   (a plain MMIO read)
#   echo on > /sys/bus/usb/devices/usb3/power/control       (a resume)
#   echo ff520000.usb > .../drivers/ohci-platform/unbind    (ohci_stop)
#
# and it is why `reboot` hung: device_shutdown() reaches ohci-platform, calls
# _ohci_shutdown(), touches a register and never returns. It was not the clocks
# (hclk_host0 enabled at 148.5 MHz) nor the PHY (sclk_otgphy1_480m enabled).
#
# Unbinding the driver is the whole fix: device_shutdown() only calls
# dev->driver->shutdown, so a device with no driver bound is skipped entirely -
# which is exactly why the EHCI node, having no driver, never appeared in the
# shutdown list at all.
#
# Enabling the EHCI is what keeps the port useful: it is what the vendor builds,
# it is the half of the block that works, and the port is behind a hub, so
# full- and low-speed devices still reach it through the hub's transaction
# translator rather than needing the companion OHCI.
CONFIG_USB_EHCI_HCD_PLATFORM=y
# CONFIG_USB_OHCI_HCD_PLATFORM is not set

# ...and the reason that last line alone was not enough. multi_v7_defconfig
# turns on USB_OHCI_HCD_OMAP3, whose Kconfig does an unconditional
#
#   select USB_OHCI_HCD_PLATFORM
#
# and a select cannot be overridden by a fragment - Kconfig forces the symbol
# back on and the build comes out with OHCI still bound. Verified: the first
# build with the line above still produced CONFIG_USB_OHCI_HCD_PLATFORM=y.
#
# USB_OHCI_HCD_OMAP3 is a deprecated stub whose driver was already removed
# ("use USB_OHCI_HCD_PLATFORM instead"), nothing selects it in turn, and this
# board is obviously not an OMAP. Dropping it releases the select.
# CONFIG_USB_OHCI_HCD_OMAP3 is not set

# Audio, added by 0004-ASoC-* and 0005-ASoC-*.
#
# Every one of these has to be =y, not =m. The az01-ksrc path installs no
# modules at all (AZ0X_ESSENTIAL_MODULES is empty there), so a driver built as
# a module is simply absent at runtime. multi_v7_defconfig leaves the whole
# sound stack at =m, which is why there was no card before this.
#
# CONFIG_SOUND has to lead. sound/Kconfig wraps the entire subsystem in
# "if SOUND", so that tristate caps every symbol beneath it: with SOUND=m,
# asking for SND=y silently yields SND=m and the whole chain follows. The first
# build of this fragment came out =m throughout for exactly that reason.
CONFIG_SOUND=y
CONFIG_SND=y
CONFIG_SND_SOC=y
CONFIG_SND_SOC_ROCKCHIP_I2S=m
CONFIG_SND_SOC_ROCKCHIP_AZ0X=m
CONFIG_SND_SOC_AZ0X_AUDIO_CODEC=y

# The SPDIF controller is in the DT on some boards but not JP11; harmless to
# leave out, and cheaper than carrying a driver nothing binds.
# CONFIG_SND_SOC_ROCKCHIP_SPDIF is not set

# The control surface - every jog wheel, fader, knob and button on the unit.
#
# They are not GPIOs and not on the SARADC. They are behind an internal USB
# device:
#
#   idVendor 15e4  idProduct 800c  "Denon DJ" / "PRIME GO Control Surface"
#   1-1:1.0  bInterfaceClass=01   1-1:1.1  bInterfaceClass=01
#
# Class 01 is USB Audio, and snd-usb-audio drives both the audio and the MIDI
# streaming interfaces under it - which is how a DJ control surface normally
# appears. Without this, nothing binds to either interface and the entire
# control panel is dead: only the touchscreen and gpio-keys show up in
# /proc/bus/input/devices.
#
# Every one of these must be =y. The vendor kernel has them all built in
# (read out of its zImage via IKCONFIG) and we had SND_USB_AUDIO, SND_RAWMIDI
# and SND_HWDEP at =m - dead on the az01-ksrc path, which installs no modules -
# and SND_SEQUENCER missing entirely.
CONFIG_SND_USB_AUDIO=y
CONFIG_SND_RAWMIDI=y
CONFIG_SND_HWDEP=y
CONFIG_SND_SEQUENCER=y

# Bluetooth. The BCM4345 is a combo part - the same chip as the Wi-Fi - with
# the radio on uart0, described in the device tree as:
#
#   bluetooth {
#       compatible = "brcm,bcm43438-bt";
#       device-wakeup-gpios = <&gpio4 26 0>;
#       shutdown-gpios = <&gpio4 29 0>;
#   };
#
# All four of these must be =y. BT and BT_HIDP were =m and =n respectively, and
# BT_HCIUART and BT_BCM were =m - dead on the az01-ksrc path, which installs no
# modules. The vendor kernel has BT and BT_HIDP built in and the UART transport
# as a module, which works for it because it does install modules.
#
# The patchram is brcm/BCM4345C5.hcd, which az0x-firmware already installs -
# the driver asks for it by hardware id (btbcm.c maps 0x6606 to BCM4345C5), and
# with the transport built as a module the request happens after the rootfs is
# mounted.
CONFIG_BT=y
CONFIG_BT_HIDP=y
CONFIG_BT_HCIUART=m
CONFIG_BT_BCM=m
# A note on =y versus =m, because this fragment is full of both.
#
# Modules are installed again, so =m no longer means "silently absent". The
# symbols above are pinned =y only where the vendor also builds them in, or
# where they must exist before the rootfs is mounted (console, eMMC, ext4,
# DEVTMPFS). Everything the vendor ships as a .ko is =m here too:
#
#   CFG80211 BRCMFMAC BRCMUTIL        Wi-Fi
#   BT_HCIUART BT_BCM                 Bluetooth transport
#   SND_SOC_ROCKCHIP_I2S SND_SOC_ROCKCHIP_AZ0X   audio platform
#
# SND_SOC_ROCKCHIP_AZ0X is pinned =m in its own right. Before 6.18 it depended
# on a tristate SND_SOC_ROCKCHIP, whose =m capped it; that symbol is gone.
#
# These had been forced to =y purely to work around modules not being
# installed, which is no longer true.

# --- Removable media filesystems ---------------------------------------------
#
# This is a DJ device: people plug in arbitrary USB sticks and SD cards full of
# music. Before this we could mount VFAT and read-only NTFS and nothing else -
# a Fedora install stick failed with "unknown filesystem type 'iso9660'", and
# any card over 32 GB is exFAT by default, which is the common case for a music
# library.
#
# All of these are mainline. NTFS3 is the read/write driver (the NTFS_FS we had
# is the deprecated read-only one, gone in 6.9); between NTFS3 and HFS+ this
# covers what the vendor licensed Paragon UFSD for on az01-premium, without the
# proprietary module.
CONFIG_EXFAT_FS=y
CONFIG_NLS_UTF8=y
CONFIG_ISO9660_FS=y
CONFIG_JOLIET=y
CONFIG_ZISOFS=y
CONFIG_UDF_FS=m
CONFIG_HFS_FS=m
CONFIG_HFSPLUS_FS=m
CONFIG_NTFS3_FS=y
CONFIG_NTFS3_LZX_XPRESS=y
CONFIG_NTFS3_FS_POSIX_ACL=y

# USB hub attach (jp13 and relatives). Built in rather than modular so the
# ports are live as soon as i2c is, with no module load ordering to depend on.
CONFIG_USB_AZ01_HUB=y

# Rockchip power domains. On 6.18 ROCKCHIP_PM_DOMAINS depends on
# HAVE_ARM_SMCCC_DISCOVERY, which on 32-bit ARM only ARM_PSCI_FW provides.
# Without it the GPU, VPU and display domains are never managed. The AZ01
# device trees have no psci node, so the PSCI client itself stays idle.
CONFIG_ARM_PSCI=y

# Legacy iptables. ConnMan's firewall uses the xtables (legacy) interface, and
# on 6.18 those tables sit behind NETFILTER_XTABLES_LEGACY.
CONFIG_NETFILTER_XTABLES_LEGACY=y
