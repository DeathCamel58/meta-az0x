# Baseline deltas on top of multi_v7_defconfig for the AZ01 boards.

# multi_v7_defconfig does NOT set these, and systemd will not come up without
# a devtmpfs mounted on /dev.
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y

# The console is NOT specified on the kernel command line - the vendor u-boot's
# bootargs carry no console= at all (confirmed by reading the env off a JP11).
# It comes entirely from the device tree's chosen/stdout-path = "serial2:...".
# So if these regress, the board goes completely silent with no error. Pin them.
CONFIG_SERIAL_8250=y
CONFIG_SERIAL_8250_CONSOLE=y
CONFIG_SERIAL_8250_DW=y
CONFIG_SERIAL_OF_PLATFORM=y
CONFIG_SERIAL_EARLYCON=y

# Keep /lib/modules/<version> stable across rebuilds so the modules path does
# not move under the rootfs on every commit.
# CONFIG_LOCALVERSION_AUTO is not set

# --- Boot-critical: the eMMC cannot probe without its regulators -------------
# The jp11 eMMC node (dwmmc@ff0f0000) has vmmc-supply and vqmmc-supply pointing
# at regulators on the ACT8846 PMIC (compatible "active-semi,act8846", handled
# by the act8865 driver). multi_v7_defconfig does not enable it, so those
# supplies never register, dw_mmc defers forever, no root device appears and
# the kernel sits in rootwait with no error beyond a lone
# "deferred probe pending". Observed exactly that on the first D1 boot.
# REGULATOR_ACT8865 is "depends on I2C && POWER_SUPPLY". POWER_SUPPLY is not in
# multi_v7_defconfig, so without this line the act8865 line is SILENTLY DROPPED
# by the alldefconfig merge - no error, it just never appears in .config.
# (POWER_SUPPLY is wanted anyway: inmusic,az01-power is a power_supply driver.)
CONFIG_POWER_SUPPLY=y
CONFIG_REGULATOR_ACT8865=y

# --- Built-in, not modular --------------------------------------------------
# These are =m in multi_v7_defconfig, and this image ships no modules at all,
# so modular means absent. Both are wanted: the RTC for wall-clock time, and
# the SARADC because inmusic,az01-power reads io-channels = <&saradc 0>.
CONFIG_RTC_DRV_HYM8563=y
CONFIG_ROCKCHIP_SARADC=y
