# ConnMan keeps its technology state in /var/lib/connman/settings, but this
# image has a read-only rootfs and /var/lib is a tmpfs, so whatever ConnMan
# writes is gone at the next boot. It defaults WiFi to Enable=false and
# soft-blocks the radio through rfkill, so Wi-Fi is dead on every boot until
# someone enables it by hand.
#
# Seed the file at boot instead. C copies only when the destination is absent,
# so anything ConnMan writes during a session still wins for that session.
d /var/lib/connman 0700 root root - -
C /var/lib/connman/settings 0600 root root - /usr/share/az0x/connman-settings
