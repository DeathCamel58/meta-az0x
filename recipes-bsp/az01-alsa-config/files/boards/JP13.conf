# Denon DJ SC6000 Prime (JP13): two independent players ("layers") on one
# four-channel DAI.
#
#   ch0  layer A left       ch2  layer B left
#   ch1  layer A right      ch3  layer B right
#
# Each layer drives its RCA line out and its digital out together. There is
# no headphone output and no audio input.
#
# Measured by ear on the RCA outputs; the vendor kernel has the same map.
# Beware speaker-test -s on a 4-channel device: it walks the speakers
# clockwise (FL, FR, RR, RL), so -s 3 plays ch3 and -s 4 plays ch2.
#
# Both layers are dshare slices of the same hardware PCM, so both can be open
# at once, one client each. They share the slave below, so they run at its
# rate and format; the plug in front converts anything else.

pcm_slave.az01_layers {
	pcm "hw:CARD=JP13,DEV=0"
	channels 4
	rate 44100
	format S32_LE
}

pcm.az01_layer_a_share {
	type dshare
	ipc_key 0x617a3031
	ipc_perm 0666
	slave az01_layers
	bindings { 0 0 1 1 }
}

pcm.az01_layer_b_share {
	type dshare
	ipc_key 0x617a3031
	ipc_perm 0666
	slave az01_layers
	bindings { 0 2 1 3 }
}

pcm.layer_a {
	type plug
	slave.pcm "az01_layer_a_share"
	hint {
		show on
		description "Layer A - line out A and digital out A"
	}
}

pcm.layer_b {
	type plug
	slave.pcm "az01_layer_b_share"
	hint {
		show on
		description "Layer B - line out B and digital out B"
	}
}
