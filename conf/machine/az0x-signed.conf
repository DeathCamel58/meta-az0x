#@TYPE: Machine
#@NAME: az0x-signed
#@DESCRIPTION: inMusic signed-boot generation - JC11S, JP11S, JP20, JP21, JP21X, JP23
#
# IMPORTANT - this board verifies its kernel, so booting your own needs a way
# to sign it.
#
# It does not boot zImage out of the rootfs. u-boot loads a signed FIT from
# the dedicated kernel partition:
#
#   az01_bootcmd = ... part number mmc 0 kernel part;
#                  load mmc ${dev}:${part} 0x800800 kernel.fit;
#                  fdtfile=0x800800#conf-${board}#cmdline; bootm $fdtfile
#
# and u-boot's own control FDT carries required = "conf" against key
# denon-1 (sha256,rsa2048), so the kernel and its device tree are both
# verified before boot. With a stock chain and no way around it, a kernel we
# build cannot start, and the /boot/zImage and dtbs inside the rootfs are
# build leftovers u-boot never reads.
#
# That is a constraint on the operator, not on the board. A tester using
# embargoed workarounds has booted linux-yocto-rt built from this layer on a
# Prime 4 Plus - our kernel, our device tree, our rootfs. Given a way onto the
# device, this machine runs a from-source stack like any other.
#
# What IS replaceable is the rootfs: nothing re-verifies it at boot - no
# dm-verity, no IMA, no signed root hash - which is why a custom userspace
# works here at all.
#
# Hence AZ0X_KERNEL_PROVIDER defaults to "prebuilt" for this machine, and the
# guard rail in az0x-image-base.inc makes overriding it a deliberate act rather
# than an accident.
#
# On the from-source path this layer emits a kernel FIT in the vendor shape
# (kernel + fdt-<board> + fdt-cmdline, configurations conf-<board> and cmdline;
# see az0x-signed-fit.inc). It does not sign it: getting that FIT onto the
# device and past the signature check is left to an external boot-activation
# tool.

# A default, not a constraint. See the note above: an unsigned kernel cannot
# start on stock u-boot, so this is the only choice that works unaided. Set
# explicitly here so a tree-wide AZ0X_KERNEL_PROVIDER in local.conf cannot
# silently produce an unbootable image for this machine. Weak, so an explicit
# choice in local.conf still wins - the guard rail in az0x-image-base.inc is
# what makes that choice deliberate, via AZ0X_KERNEL_ALLOW_UNSIGNED.
AZ0X_KERNEL_PROVIDER ?= "prebuilt"

require conf/machine/include/az01-common.inc

AZ0X_BOARD_DIR = "az0x-signed"
AZ0X_BOARD_KVER = "6.1.111-inmusic-2024-09-19-rt41"
# Cosmetic on this machine. u-boot boots the signed kernel.fit from the kernel
# partition, so the dtbs in our rootfs are never read - this only decides which
# one kernel-devicetree builds. The vendor ships all four in /boot for the same
# reason: appearances.
AZ0X_BOARD_DTB = "rk3288-az01-jc11s"

# 541,202,432 bytes, read off the rootfs partition of JC11S-4.3.2.img. One
# filesystem serves every device in the group: the partition's device mask in
# the AZ0x container covers all six, which is why this is one machine and not
# six. Panel rotation differs between them (JC11S 90, JP11S/JP20/JP21 270) and
# is derived at boot from the device tree by az0x-panel-rotation, exactly as
# the vendor's own single image does.
AZ0X_ROOTFS_KIB = "528518"

# 10.1" panel, urt,umo-p080md-t, rotation 0x5a (90 degrees) - identical to

# This board's firmware ships no boot.scr.uimg: u-boot boots the FIT from the
# kernel partition directly and needs no script in the rootfs.
# Must be the machine-specific override, not a plain assignment: the image
# base sets AZ0X_BOOTSCRIPT_INSTALL:az01, and :az01 beats an unsuffixed value.
# MACHINEOVERRIDES is "az01:az0x-signed" and the LAST match wins, so the
# machine-specific form is the one that takes effect.
AZ0X_BOOTSCRIPT_INSTALL:az0x-signed = ""

# Login console. az01-common.inc's ttyS2 does not exist on this board: in the
# rk3288-az01-jc11s DTB uart2 (ff690000) is disabled and only uart0 (ttyS0)
# and uart3 (ff1b0000, ttyS3) are enabled. The FIT bootargs carry no console=,
# so the kernel follows the DT stdout-path - which booted under emulation
# reports "printk: console [ttyS3] enabled" - and the vendor's own runtime
# cmdline uses console=ttyS3,115200n8. Put the getty where the console is.
SERIAL_CONSOLES = "115200;ttyS3"
