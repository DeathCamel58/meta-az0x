#@TYPE: Machine
#@NAME: az04
#@DESCRIPTION: inMusic Brands "EngineOS" AZ04 family - Rockchip RK3588, aarch64.
#              Reference device: Rane SYSTEM ONE (RMZ2).
#
# Confirmed from the vendor kernel.fit's device tree, not inferred:
#   compatible = "inmusic,rmz2", "inmusic,az04", "rockchip,rk3588"
#   model      = "Rane SYSTEM ONE"
#   4x cortex-a76 + 4x cortex-a55
#
# As with az01 this machine REUSES the vendor's compiled kernel and modules as
# opaque prebuilts and builds no kernel and no bootloader.
#
# !! SCAFFOLD ONLY. An az04 rootfs built here is NOT flashable today: the
# !! device mounts / through dm-verity, with the root hash carried in an
# !! RSA-2048-signed FIT. See the "az04 status" section of ../../../README.md
# !! before spending time on this.

# rk3588 basics from meta-rockchip: SOC_FAMILY, rockchip MACHINEOVERRIDES and
# the cortexa76-cortexa55 tune include.
require conf/machine/include/rk3588.inc

# Board facts, same shape as the az01 boards declare.
AZ0X_BOARD_DIR = "az04"
AZ0X_BOARD_KVER = "6.18.9-imb-2026-02-06-rt3"
AZ0X_ROOTFS_KIB = "823980"
AZ0X_EXT4_BLOCKSIZE = "4096"
AZ0X_EXT4_INODE_RATIO = "16384"

# --- Toolchain / ABI -------------------------------------------------------
# Vendor aarch64 binaries: ELF 64-bit LSB, interpreter
# /usr/lib/ld-linux-aarch64.so.1 (usr-merged), libstdc++.so.6.0.32 (gcc 13),
# and the vendor's own FFmpeg was built -mcpu=cortex-a76.cortex-a55.
#
# rk3588s.inc defaults to "cortexa76-cortexa55-crypto". We drop the -crypto
# variant: the vendor's -mcpu carries no explicit +crypto, and the crypto
# extensions are an ISA feature rather than an ABI one, so plain
# cortexa76-cortexa55 is the conservative match. Either is ABI-compatible.
DEFAULTTUNE = "cortexa76-cortexa55"

# --- Kernel ----------------------------------------------------------------
PREFERRED_PROVIDER_virtual/kernel = "linux-az04-prebuilt"
KERNEL_IMAGETYPE = "Image"
KERNEL_DEVICETREE = ""

# rk3588s.inc sets these for a real kernel build. We never build one, so make
# sure nothing tries to wrap our prebuilt Image in a fresh FIT.
KERNEL_CLASSES = ""

# --- Bootloader ------------------------------------------------------------
# Explicitly none. rk3588.inc -> rk3588s.inc pulls in rockchip-wic.inc, which
# adds wic to IMAGE_FSTYPES and makes WKS_FILE_DEPENDS pull virtual/bootloader.
# Undo all of it: the vendor's own loader/u-boot partitions are left untouched.
PREFERRED_PROVIDER_virtual/bootloader = ""
UBOOT_MACHINE = ""
SPL_BINARY = ""
WKS_FILE_DEPENDS = ""
MACHINE_FEATURES:remove = "efi"
EXTRA_IMAGEDEPENDS = ""
IMAGE_BOOT_FILES = ""

# rockchip-extlinux.inc (also dragged in by rockchip-wic.inc) does:
#   MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "u-boot-extlinux"
#   MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "kernel-image ... kernel-devicetree"
# which makes packagegroup-core-boot RDEPEND on u-boot. There is no u-boot in
# this build, so that is a hard "Nothing RPROVIDES 'u-boot-extlinux'" failure.
# Assign (do not append) to wipe those out. az04 needs only the modules in the
# rootfs - its kernel and dtb live in the signed FIT on the boot partition.
MACHINE_ESSENTIAL_EXTRA_RDEPENDS = "kernel-modules"
UBOOT_EXTLINUX = "0"

# Defuse a landmine in rockchip-extlinux.inc:
#   NONFITDT ?= "${@d.getVar('KERNEL_DEVICETREE').split()[0].split('/')[1]}"
# With KERNEL_DEVICETREE empty (we ship prebuilt dtbs) that expression raises
# IndexError the moment anything expands it. Nothing does today, but pin it.
NONFITDT = ""

# --- Image -----------------------------------------------------------------
# Set (not +=) so the "wic wic.bmap" that rockchip-wic.inc appended is gone.
IMAGE_FSTYPES = "ext4"
IMAGE_CLASSES:remove = "image_types_wic"

# --- Console / hardware ----------------------------------------------------
# The vendor dtb's chosen node says stdout-path = "serial2:1500000n8", which
# is exactly rockchip-defaults.inc's default. Stated here for the record.
SERIAL_CONSOLES = "1500000;ttyS2"

MACHINE_FEATURES = "usbhost usbgadget alsa screen ext2 rtc"

