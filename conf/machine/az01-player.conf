#@TYPE: Machine
#@NAME: az01-player
#@DESCRIPTION: inMusic "EngineOS" AZ01 - Denon Prime Go and siblings ("Planck AZ01 Player").
#              HWIDs: jp07, jp08, jp11. Rockchip RK3288, armv7hf.
#
# Vendor artifacts: vendor/az01-player/
# dev ids : 0x15e4d006, 0x15e4d00a, 0x15e4d00c
# Prime Go is jp11. 8 dtbs (incl. jp08 revf variants), 76 modules, no UFSD.
# zImage and lib/firmware are BYTE-IDENTICAL to az01-premium's.
require conf/machine/include/az01-common.inc

AZ0X_BOARD_DIR = "az01-player"
AZ0X_BOARD_KVER = "6.6.119-az01-2025-12-17-rt67"
AZ0X_ROOTFS_KIB = "504076"


# dtb basename for a from-source kernel build (KERNEL_DEVICETREE).
# CONFIRMED against the unit's u-boot: `fdtfile=rk3288-az01-jp11.dtb`.
# This matters because boot.scr does `load ... ${fdtfile} || exit` - a wrong
# name is a silent non-boot with no error anywhere.
AZ0X_BOARD_DTB = "rk3288-az01-jp11"
