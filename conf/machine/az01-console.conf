#@TYPE: Machine
#@NAME: az01-console
#@DESCRIPTION: inMusic "EngineOS" AZ01 - Denon consoles ("Planck AZ01 Console").
#              HWIDs: jc11, jc16, nh08. Rockchip RK3288, armv7hf.
#
# Vendor artifacts: vendor/az01-console/
# dev ids : 0x15e4d008, 0x15e4d00b, 0x15e4203f
# 5 dtbs - note rk3288-az05-nh08.dtb: az05 is a board generation, still RK3288.
# 76 modules, no UFSD. zImage and lib/firmware identical to az01-premium's.
require conf/machine/include/az01-common.inc

AZ0X_BOARD_DIR = "az01-console"
AZ0X_BOARD_KVER = "6.6.119-az01-2025-12-17-rt67"
AZ0X_ROOTFS_KIB = "503936"

# Panel rotation for X11 images. dtb rotation=0x5a (90) on all its dtbs - the opposite of player/premium. Untested on hardware.
AZ0X_XORG_ROTATE = "right"
AZ0X_XORG_TOUCH_MATRIX = "0 1 0 -1 0 1 0 0 1"
