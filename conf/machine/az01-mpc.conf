#@TYPE: Machine
#@NAME: az01-mpc
#@DESCRIPTION: inMusic "EngineOS" AZ01 - Akai MPC family ("MPC upgrade image").
#              HWIDs: acv5, acv8, acva, acva2, acvb, acvm, acvr, acv5s. Rockchip RK3288, armv7hf.
#
# Vendor artifacts: vendor/az01-mpc/
# dev ids : 0x09e8403a 0x09e8403b 0x09e84046 0x09e84047 0x09e8404b 0x09e84052 0x09e84056 0x09e84057
# A DIFFERENT generation: kernel 6.18.26 (not 6.6.119), 14 dtbs spanning az01 and
# az05 boards, 81 modules, newer regulatory.db and no eta5805 DSP firmware. Its
# container is rootfs-only (1 partition, no splash).
require conf/machine/include/az01-common.inc

AZ0X_BOARD_DIR = "az01-mpc"
AZ0X_BOARD_KVER = "6.18.26-az01-2026-04-30-rt4"
AZ0X_ROOTFS_KIB = "430936"

# Panel rotation for X11 images: deliberately UNSET.
# This family is not uniform - acv5s and mpc-acv5 report dtb rotation=0x5a (90)
# while acva/acvb/acvm/acv8 and the az05 boards report 0x10e (270). One static
# xorg.conf cannot serve both, and guessing hands half the devices a sideways
# screen. Setting these needs either a per-HWID split or reading

# Default dtb basename for a from-source kernel build (KERNEL_DEVICETREE).
# Confirm against the unit's u-boot `printenv fdtfile` before relying on it.
AZ0X_BOARD_DTB = "rk3288-az01-acva"
