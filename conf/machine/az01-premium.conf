#@TYPE: Machine
#@NAME: az01-premium
#@DESCRIPTION: inMusic "EngineOS" AZ01 - Denon SC6000 / SC6000M ("Planck AZ01 Premium").
#              HWIDs: jp13, jp14. Rockchip RK3288, armv7hf.
#
# Vendor artifacts: vendor/az01-premium/
# dev ids : 0x15e4d00d, 0x15e4d00e
# 4 dtbs, 78 modules - the only family that ships Paragon UFSD (ufsd.ko, jnl.ko),
# which is what lets it read NTFS/HFS+ USB media.
require conf/machine/include/az01-common.inc

AZ0X_BOARD_DIR = "az01-premium"
AZ0X_BOARD_KVER = "6.6.119-az01-2025-12-17-rt67"
AZ0X_ROOTFS_KIB = "504276"

# Panel rotation for X11 images. dtb rotation=0x10e (270) on all four jp13/jp14 dtbs - same as az01-player, but untested on hardware.
AZ0X_XORG_ROTATE = "left"
AZ0X_XORG_TOUCH_MATRIX = "0 -1 1 1 0 0 0 0 1"

# Default dtb basename for a from-source kernel build (KERNEL_DEVICETREE).
# Confirm against the unit's u-boot `printenv fdtfile` before relying on it.
AZ0X_BOARD_DTB = "rk3288-az01-jp13"
