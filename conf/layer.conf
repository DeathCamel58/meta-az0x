# meta-az0x - BSP layer for inMusic Brands AZ0x devices (az01 RK3288, az04 RK3588)
# Released under the MIT license.

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "az0x"
BBFILE_PATTERN_az0x = "^${LAYERDIR}/"
BBFILE_PRIORITY_az0x = "10"

LAYERVERSION_az0x = "1"
LAYERSERIES_COMPAT_az0x = "scarthgap"
# A BSP layer: machines, kernels and board support only. Images and distro
# policy live in a distro layer (meta-openaz0x).
LAYERDEPENDS_az0x = "core rockchip"

# Where the vendor prebuilts live, relative to this layer. Each machine gets
# its own subdirectory - the two families share no binaries at all, since they
# are different CPU architectures.
#   ../vendor/az01-premium/  armv7hf RK3288  jp13, jp14
#   ../vendor/az01-player/   armv7hf RK3288  jp07, jp08, jp11
#   ../vendor/az01-console/  armv7hf RK3288  jc11, jc16, nh08
#   ../vendor/az01-mpc/      armv7hf RK3288  acv*
#   ../vendor/az04/          aarch64 RK3588  rmz2
AZ0X_VENDOR_DIR ?= "${LAYERDIR}/../vendor"

# Per-board facts are declared by each conf/machine/*.conf, not here - there
# are several boards per family and their kernels genuinely differ. Each board
# sets AZ0X_BOARD_DIR (its vendor/ subdir) and AZ0X_BOARD_KVER. These defaults
# only exist so the recipes parse when no MACHINE is selected.
AZ0X_BOARD_DIR ?= ""
AZ0X_BOARD_KVER ?= "0"
